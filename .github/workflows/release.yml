name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  metadata:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      build: ${{ steps.version.outputs.build }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: version
        name: Validate tag and release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 tools/ci/release_metadata.py

  checks:
    uses: ./.github/workflows/checks.yml

  build:
    name: Build ${{ matrix.platform }}
    needs: [metadata, checks]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            os: ubuntu-24.04
          - platform: ios
            os: macos-15
          - platform: macos
            os: macos-15
          - platform: windows
            os: windows-2022
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
      RELEASE_BUILD: ${{ needs.metadata.outputs.build }}
      RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - uses: actions/setup-java@v4
        if: matrix.platform == 'android'
        with:
          distribution: temurin
          java-version: '17'
      - name: Resolve dependencies
        run: flutter pub get --enforce-lockfile
      - name: Restore existing Android release key
        if: matrix.platform == 'android'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: python3 tools/ci/restore_android_key.py
      - name: Build signed APK
        if: matrix.platform == 'android'
        shell: bash
        run: |
          flutter build apk --release --split-per-abi --target-platform=android-arm,android-arm64 --build-name="$RELEASE_VERSION" --build-number="$RELEASE_BUILD"
          mkdir -p dist
          for ABI in armeabi-v7a arm64-v8a; do
            cp "build/app/outputs/flutter-apk/app-${ABI}-release.apk" "dist/nuistaio-${RELEASE_TAG}-android-${ABI}.apk"
          done
      - name: Build unsigned IPA for re-signing
        if: matrix.platform == 'ios'
        shell: bash
        run: |
          flutter build ios --release --no-codesign --build-name="$RELEASE_VERSION" --build-number="$RELEASE_BUILD"
          mkdir -p build/ios/package/Payload dist
          ditto build/ios/iphoneos/Runner.app build/ios/package/Payload/Runner.app
          (cd build/ios/package && zip -qry "$GITHUB_WORKSPACE/dist/nuistaio-${RELEASE_TAG}-ios-unsigned.ipa" Payload)
      - name: Build macOS Intel and Apple silicon archives
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          flutter build macos --release --build-name="$RELEASE_VERSION" --build-number="$RELEASE_BUILD"
          APP="build/macos/Build/Products/Release/nuist_aio.app"
          lipo "$APP/Contents/MacOS/nuist_aio" -verify_arch arm64
          lipo "$APP/Contents/MacOS/nuist_aio" -verify_arch x86_64
          mkdir -p dist
          python3 tools/ci/package_macos.py "$APP" dist "$RELEASE_TAG"
      - name: Build Windows portable archive
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          flutter build windows --release --build-name=$env:RELEASE_VERSION --build-number=$env:RELEASE_BUILD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath "dist/nuistaio-$env:RELEASE_TAG-windows-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Remove restored signing files
        if: always() && matrix.platform == 'android'
        shell: bash
        run: rm -f android/key.properties android/keystore/nuistaio-release.jks

  publish:
    name: Publish GitHub Release
    needs: [metadata, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Publish all four platforms together
        shell: bash
        run: |
          python3 tools/ci/check_assets.py dist "$RELEASE_TAG"
          (cd dist && sha256sum nuistaio-* > SHA256SUMS.txt)
          python3 tools/ci/release_notes.py RELEASE_NOTE.md "$RUNNER_TEMP/release-notes.md"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
            gh release edit "$RELEASE_TAG" --title "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md" --draft=false --prerelease=false --latest
          else
            gh release create "$RELEASE_TAG" dist/* --verify-tag --title "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md" --latest
          fi

  mirror:
    name: Sync releases to Gitee
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check Gitee token configuration
        id: gitee
        shell: bash
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          if [[ -n "$GITEE_TOKEN" ]]; then
            # Upstream debug output can include the first nine token characters.
            echo "::add-mask::${GITEE_TOKEN:0:9}"
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Gitee sync skipped: GITEE_TOKEN is not configured."
          fi
      - name: Sync GitHub releases and attachments to Gitee
        if: steps.gitee.outputs.enabled == 'true'
        # Marketplace sync-release-to-gitee; v1.0 has a broken script entry point.
        uses: H-TWINKLE/sync-action@0d8e95d78481848a0f3f95a737aef45437102269
        timeout-minutes: 12
        with:
          gitee_owner: ded_retr0
          gitee_repo: NUIST-AIO
          gitee_token: ${{ secrets.GITEE_TOKEN }}
          github_owner: ${{ github.repository_owner }}
          github_repo: ${{ github.event.repository.name }}
          gitee_upload_retry_times: '3'
          # Upstream uses string truthiness, so even 'false' enables debug logging.
          debug: ''
